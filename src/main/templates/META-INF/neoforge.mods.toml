modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="${mod_url}/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="${mod_url}"
logoFile="logo.png"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sereneseasons"
    type="optional"
    versionRange="[10.1,)"
    ordering="NONE"
    side="BOTH"

# Particle Rain is never compiled against: any version may be installed, hooks that do not fit it are skipped.
[[dependencies.${mod_id}]]
    modId="particlerain"
    type="optional"
    versionRange="[0,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="livingwind"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="BOTH"

[[mixins]]
config="${mod_id}.mixins.json"
