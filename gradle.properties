org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
forge_version=47.4.26
# Forge 47 and NeoForge for 1.20.1 (which reports itself as Forge 47.1).
forge_version_range=[47,)
loader_version_range=[47,)
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

mixinextras_version=0.4.1

## Optional integrations
serene_seasons_version=9.1.0.3
serene_seasons_version_range=[9.1,)
glitchcore_version=0.0.1.1
distanthorizons_version=3.3.3-1.20.1
# Particle Rain is never compiled against. Any version may be installed: hooks that do not fit it are skipped.
particle_rain_version_range=[0,)

## Mod
mod_id=hoarfrost
mod_name=Hoarfrost: Snow & Blizzards
mod_version=1.3.0
mod_group_id=com.pockyl.hoarfrost
mod_license=MIT
mod_authors=Pocky
mod_description=Cosy, realistic snowy weather: seven kinds of snowfall and blizzard, flakes carried by a living wind, soft snow settling on the land and a quiet winter soundscape.
mod_url=https://github.com/Pocky-l/hoarfrost

## CurseForge
# Numeric project ID from the CurseForge project page ("About Project" sidebar).
curseforge_project_id=1736975
curseforge_client=true
curseforge_server=true
# Comma-separated CurseForge project slugs.
curseforge_requires=
curseforge_optional=serene-seasons,distant-horizons,petrichor-rain-storms,particle-rain,living-wind
